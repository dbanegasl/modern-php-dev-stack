; ==============================================================================
; FPM pool overrides for local development
; ==============================================================================
; El pool por defecto de Alpine (pm.max_children = 5) se satura con ráfagas de
; peticiones paralelas (AJAX concurrentes, reportes CSP en DEV, DataTables,
; thumbnails de media) y serializa el resto: los fetch quedan "pending" varios
; segundos. En dev la memoria no es la restricción, así que se amplía el pool.

[www]
pm = dynamic
pm.max_children = 15
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
